<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sedit</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
      <rect x="2.6" y="4.6" width="18.8" height="14.8" rx="3.6"
            fill="none" stroke="currentColor" stroke-width="1.8"/>
      <path d="M9.9 9.3v5.4l4.6-2.7z" fill="currentColor"/>
      <path d="M2.6 12h4M17.4 12h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
    <span class="brand-name">Sedit</span>
  </div>
  <div class="topbar-actions">
    <button id="themeToggle" class="icon-btn icon-btn-sm" title="Toggle light / dark"></button>
    <input id="filenameInput" class="filename-input" type="text" value="my-edit" spellcheck="false">
    <select id="formatSelect" class="select" title="Export format"></select>
    <button id="exportBtn" class="btn btn-primary">Export</button>
  </div>
</header>

<main class="workspace">

  <aside class="panel layers-panel">
    <div class="panel-header">Layers</div>
    <div id="layerList" class="layer-list">
      <div class="empty-hint">No media yet. Add a video, audio or image file to get started.</div>
    </div>
    <label class="add-layer-btn" for="fileInput">
      <span>+ Add Media</span>
    </label>
    <input type="file" id="fileInput" accept="video/*,audio/*,image/*" multiple hidden>
    <button id="addTextBtn" class="add-layer-btn add-layer-secondary" type="button">+ Add Text</button>
  </aside>

  <section class="preview-area">
    <div id="stage" class="stage">
      <canvas id="previewCanvas"></canvas>
      <div id="dropHint" class="drop-hint">Drop or paste a video, audio, or image here</div>
      <div id="stageOverlay" class="stage-overlay"></div>
      <div id="selectionBox" class="selection-box hidden">
        <div class="handle handle-nw" data-handle="nw"></div>
        <div class="handle handle-ne" data-handle="ne"></div>
        <div class="handle handle-sw" data-handle="sw"></div>
        <div class="handle handle-se" data-handle="se"></div>
      </div>
      <div id="cropOverlay" class="crop-overlay hidden">
        <div class="crop-mask crop-mask-t"></div>
        <div class="crop-mask crop-mask-b"></div>
        <div class="crop-mask crop-mask-l"></div>
        <div class="crop-mask crop-mask-r"></div>
        <div class="crop-rect" id="cropRectEl">
          <div class="crop-size-badge" id="cropSizeBadge"></div>
          <div class="handle handle-nw" data-handle="nw"></div>
          <div class="handle handle-ne" data-handle="ne"></div>
          <div class="handle handle-sw" data-handle="sw"></div>
          <div class="handle handle-se" data-handle="se"></div>
        </div>
      </div>
    </div>

    <div class="transport">
      <button id="playBtn" class="icon-btn" title="Play / Pause (Space)"></button>
      <span id="timeLabel" class="time-label">0:00.0 / 0:00.0</span>

      <div class="transport-group">
        <button id="cropToggleBtn" class="btn btn-ghost" title="Crop the output frame">Crop</button>
        <select id="aspectSelect" class="select" title="Lock the crop to an aspect ratio">
          <option value="free" selected>Free</option>
          <option value="16:9">16:9</option>
          <option value="9:16">9:16</option>
          <option value="1:1">1:1</option>
          <option value="4:3">4:3</option>
          <option value="3:4">3:4</option>
          <option value="4:5">4:5</option>
          <option value="21:9">21:9</option>
        </select>
      </div>

      <span class="transport-hint">Hold <kbd>Shift</kbd> while dragging a crop corner to keep its ratio</span>
    </div>

    <div class="timeline-wrap">
      <div id="timeline" class="timeline">
        <div id="trimRange" class="trim-range"></div>
        <div id="trimInHandle" class="trim-handle trim-handle-in"></div>
        <div id="trimOutHandle" class="trim-handle trim-handle-out"></div>
        <div id="playhead" class="playhead"></div>
      </div>
    </div>
  </section>

  <aside class="panel properties-panel">
    <div class="panel-header">Properties</div>
    <div id="propertiesBody" class="properties-body">
      <div class="empty-hint">Select a layer to edit its properties, or add media to begin.</div>
    </div>
  </aside>

</main>

<div id="exportOverlay" class="export-overlay hidden">
  <div class="export-card">
    <div class="export-title" id="exportTitle">Rendering…</div>
    <div class="export-bar"><div id="exportBarFill" class="export-bar-fill"></div></div>
    <div class="export-sub" id="exportSub">0:00 / 0:00</div>
    <button id="exportCancelBtn" class="btn btn-ghost btn-sm">Cancel</button>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="app.js"></script>
</body>
</html>
